[pytest]
testpaths = tests
pythonpath = src
addopts = --strict-markers
markers =
    unit: tier marker, applied from tests/unit/
    integration_mock: tier marker, applied from tests/integration_mock/
    integration_real: tier marker, applied from tests/integration_real/
    e2e: tier marker, applied from tests/e2e/
    local_only: needs a local-only resource; deselected in CI
