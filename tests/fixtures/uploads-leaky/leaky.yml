name: Fixture / Leaky uploads

# Self-test of the fixtures upload check: a step that would publish the fixtures. Must be reported.

on: workflow_call

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: '**/build/test-results/'
      - uses: actions/upload-artifact@v4
        with:
          name: oops
          path: ${{ runner.temp }}/fixtures
