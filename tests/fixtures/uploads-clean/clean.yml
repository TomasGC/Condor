name: Fixture / Clean uploads

# Self-test of the fixtures upload check: results and coverage only, from build folders. Must pass.

on: workflow_call

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: '**/build/test-results/'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            **/build/outputs/code_coverage/
            **/build/reports/
