name: Run Gradle tasks
description: >
  Runs the Gradle tasks named by a JSON array, one ./gradlew call per task, in order, stopping at the first
  failure. Each task is one quoted argument: no word splitting, no eval, nothing re-parsed by a shell.

inputs:
  tasks:
    description: 'JSON array of task names, e.g. ["koverXmlReportDebug", "koverHtmlReportDebug"].'
    required: true
  working-directory:
    description: "Directory holding the Gradle wrapper."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Run the tasks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONDOR_TASKS: ${{ inputs.tasks }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/run.sh"
