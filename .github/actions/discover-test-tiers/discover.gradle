// Read-only discovery of test tasks. Prints one line per test task of every project:
//   TASK|<project path>|<task name>|<jvm|instrumented>|<test source files>
// A test source file is a .kt or .java file whose name ends in Test or Tests. Test sources are
// read from the project layout (suites and Android source sets), so nothing is compiled.

def countTestFiles = { Collection dirs ->
    int count = 0
    dirs.each { dir ->
        File root = dir as File
        if (root.exists()) {
            root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name ==~ /.*Tests?\.(kt|java)/) count++
            }
        }
    }
    return count
}

gradle.projectsEvaluated {
    rootProject.allprojects { p ->
        def android = p.extensions.findByName('android')
        def suites = p.extensions.findByName('testing')?.suites

        def androidSourceDirs = { String setName ->
            def set = android?.sourceSets?.findByName(setName)
            set == null ? [] : set.java.srcDirs.toList()
        }

        p.tasks.withType(org.gradle.api.tasks.testing.Test).each { t ->
            def suite = suites?.findByName(t.name)
            def dirs
            if (suite != null) {
                dirs = suite.sources.java.srcDirs.toList()
            } else {
                // Push-CI runs the debug unit task only; release unit tests are not discovered.
                def m = t.name =~ /^test(\w+)UnitTest$/
                if (!m.matches() || m.group(1) != 'Debug') return
                dirs = androidSourceDirs('test') + androidSourceDirs('testDebug')
            }
            println "TASK|${p.path}|${t.name}|jvm|${countTestFiles(dirs)}"
        }

        p.tasks.matching { it.name ==~ /connected[A-Z]\w*AndroidTest/ }.each { t ->
            def m = t.name =~ /^connected(\w+)AndroidTest$/
            if (!m.matches()) return
            // A com.android.test module keeps its test code in the main source set.
            def testModuleSets = p.plugins.hasPlugin('com.android.test') ? ['main'] : []
            def dirs = (testModuleSets + ['androidTest', "${m.group(1).uncapitalize()}AndroidTest"]).collectMany { androidSourceDirs(it) }
            println "TASK|${p.path}|${t.name}|instrumented|${countTestFiles(dirs)}"
        }
    }
}
