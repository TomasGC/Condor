name: Discover Test Tiers
description: Lists the Gradle test tasks of the calling project that have test sources, and whether instrumented tests exist

inputs:
  java-version:
    description: JDK used to run Gradle
    required: false
    default: '21'

outputs:
  jvm-matrix:
    description: 'JSON array of objects with a task key holding the Gradle task path, for every JVM and unit test task with test sources'
    value: ${{ steps.discover.outputs.jvm-matrix }}
  instrumented-task:
    description: "Gradle task path of the connected instrumented task that has test sources; empty when there is none"
    value: ${{ steps.discover.outputs.instrumented-task }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - id: discover
      shell: bash
      run: |
        ./gradlew -q --console=plain -I "${{ github.action_path }}/discover.gradle" help > discover.out
        python3 - discover.out <<'EOF' >> "$GITHUB_OUTPUT"
        import json, sys
        jvm, instrumented = [], ""
        for line in open(sys.argv[1]):
            if not line.startswith("TASK|"):
                continue
            _, project, task, kind, count = line.strip().split("|")
            if int(count) == 0:
                continue
            path = task if project == ":" else f"{project}:{task}"
            if kind == "instrumented":
                if instrumented:
                    sys.exit(f"more than one instrumented task with test sources: {instrumented}, {path}")
                instrumented = path
            else:
                jvm.append({"task": path})
        print(f"jvm-matrix={json.dumps(jvm)}")
        print(f"instrumented-task={instrumented}")
        EOF
