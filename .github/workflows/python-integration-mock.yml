name: Python / Integration Tests Mock

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      scripts-dir:
        type: string
        default: 'scripts'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cli:
    name: Integration Tests / Mock / CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.scripts-dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -r requirements-test.txt
      - name: Run CLI mock tests
        run: |
          if [ -d tests/integration_mock/cli ]; then
            python -m pytest tests/integration_mock/cli/ --no-cov -q
          else
            echo "No tests/integration_mock/cli/ for this project — skipping"
          fi

  android:
    name: Integration Tests / Mock / Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.scripts-dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -r requirements-test.txt
      - name: Run Android mock tests
        run: |
          if [ -d tests/integration_mock/android ]; then
            python -m pytest tests/integration_mock/android/ --no-cov -q
          else
            echo "No tests/integration_mock/android/ for this project — skipping"
          fi
