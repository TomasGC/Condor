name: Common / PR Title Validation

on:
  workflow_call:
    inputs:
      pr-title:
        type: string
        required: true
      title-pattern:
        description: "Extended regex the title must match. Empty: '#123: type: description'"
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate PR Title Format
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ inputs.pr-title }}
          TITLE_PATTERN: ${{ inputs.title-pattern }}
        run: |
          PATTERN="${TITLE_PATTERN:-^#[0-9]+: (feat|fix|refactor|test|docs|chore|style|perf):}"
          if ! printf '%s\n' "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "ERROR: PR title must match: $PATTERN"
            echo "Default format: #123: type: description"
            echo "Examples:"
            echo "  #1: feat: add ZIP extraction"
            echo "  #2: fix: resolve null pointer in extractor"
            echo "  #3: refactor: extract repository pattern"
            exit 1
          fi
          echo "SUCCESS: PR title format valid"
