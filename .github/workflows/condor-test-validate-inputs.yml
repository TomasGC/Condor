name: Condor / Test Validate Inputs

# The validate-inputs action run as a caller runs it, from Condor's own checkout: valid values pass, and every
# kind of bad value fails the step (continue-on-error, then the outcome is asserted) before anything else would run.
# The rules themselves are tested case by case in tests/unit; this proves the action wiring on a real runner.

on:
  push:

permissions:
  contents: read

concurrency:
  group: condor-test-validate-inputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accepts:
    name: Accepts ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: the defaults
            values: '{"coverage-report-tasks":"[\"koverXmlReportDebug\", \"koverHtmlReportDebug\"]","coverage-xml-path":"app/build/reports/kover/reportDebug.xml","coverage-artifact-path":"app/build/reports/kover/"}'
          - name: a merged variant, with other inputs around it
            values: '{"coverage-report-tasks":"[\":app:koverXmlReportMerged\"]","coverage-xml-path":"app/build/reports/kover/reportMerged.xml","coverage-artifact-path":"app/build/reports/kover/","coverage-threshold":80,"java-version":"21"}'
    steps:
      - uses: actions/checkout@v4
      - id: validate
        uses: ./.github/actions/validate-inputs
        with:
          module: kotlin-coverage
          values: ${{ matrix.values }}
      - name: Nothing may have been rejected
        env:
          REJECTED: ${{ steps.validate.outputs.rejected }}
        run: |
          echo "rejected=$REJECTED"
          if [ "$REJECTED" != "0" ]; then
            echo "::error::Expected rejected=0 from the action's output, got '$REJECTED'"
            exit 1
          fi

  rejects:
    name: Rejects ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `rejected` is how many inputs the action must name: a case passes only for that reason, so a broken
          # action (which also fails) cannot pass for a bad value.
          - name: an option instead of a task
            rejected: '1'
            values: '{"coverage-report-tasks":"[\"--init-script=/tmp/x.gradle\"]","coverage-xml-path":"a.xml","coverage-artifact-path":"a/"}'
          - name: shell syntax in a task
            rejected: '1'
            values: '{"coverage-report-tasks":"[\"a;b\"]","coverage-xml-path":"a.xml","coverage-artifact-path":"a/"}'
          - name: an empty task list
            rejected: '1'
            values: '{"coverage-report-tasks":"[]","coverage-xml-path":"a.xml","coverage-artifact-path":"a/"}'
          - name: a path that leaves the workspace
            rejected: '1'
            values: '{"coverage-report-tasks":"[\"a\"]","coverage-xml-path":"../a.xml","coverage-artifact-path":"a/"}'
          - name: an absolute artifact path
            rejected: '1'
            values: '{"coverage-report-tasks":"[\"a\"]","coverage-xml-path":"a.xml","coverage-artifact-path":"/etc/"}'
          - name: a missing input
            rejected: '1'
            values: '{"coverage-report-tasks":"[\"a\"]","coverage-xml-path":"a.xml"}'
          - name: every input wrong at once
            rejected: '3'
            values: '{"coverage-report-tasks":"[]","coverage-xml-path":"../a.xml","coverage-artifact-path":"/etc/"}'
    steps:
      - uses: actions/checkout@v4
      - id: validate
        continue-on-error: true
        uses: ./.github/actions/validate-inputs
        with:
          module: kotlin-coverage
          values: ${{ matrix.values }}
      - name: Exactly the expected inputs must have been refused
        env:
          OUTCOME: ${{ steps.validate.outcome }}
          ACTUAL: ${{ steps.validate.outputs.rejected }}
          EXPECTED: ${{ matrix.rejected }}
        run: |
          echo "outcome=$OUTCOME rejected=$ACTUAL expected=$EXPECTED"
          if [ "$OUTCOME" != "failure" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Expected the action to fail naming $EXPECTED input(s); it ended '$OUTCOME' naming '$ACTUAL'"
            exit 1
          fi
