name: Python / Detect Changes

on:
  workflow_call:
    inputs:
      scripts-dir:
        description: "Directory where Python scripts live (relative to repo root)"
        type: string
        default: 'scripts'
    outputs:
      scripts:
        description: "Whether Python scripts changed"
        value: ${{ jobs.detect.outputs.scripts }}
      docs-only:
        description: "Whether only markdown files changed in the push"
        value: ${{ jobs.detect.outputs.docs-only }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      docs-only: ${{ steps.docs-check.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: TomasGC/Condor/.github/actions/check-docs-only@main
        id: docs-check
        with:
          before: ${{ github.event.before }}
          after: ${{ github.event.after }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Patterns are relative to the repo root: a scripts-dir of '.' means no prefix ('./**' matches nothing).
          # Besides the code: the files that change what the gates run or how (requirements, tool settings).
          filters: |
            scripts:
              - '${{ inputs.scripts-dir != '.' && format('{0}/', inputs.scripts-dir) || '' }}**/*.py'
              - '${{ inputs.scripts-dir != '.' && format('{0}/', inputs.scripts-dir) || '' }}**/requirements*.txt'
              - '${{ inputs.scripts-dir != '.' && format('{0}/', inputs.scripts-dir) || '' }}pytest.ini'
              - '${{ inputs.scripts-dir != '.' && format('{0}/', inputs.scripts-dir) || '' }}pyproject.toml'
              - '${{ inputs.scripts-dir != '.' && format('{0}/', inputs.scripts-dir) || '' }}.flake8'
