name: Common / PR-CI

# Children are called with ./ paths: they come from the same Condor commit as this file, so a caller that pins
# this workflow to a SHA pins the whole PR pipeline.
#
# Called from a pull_request workflow: the PR comes from the event, the checks run on the PR's head commit (so they
# show in its checks list and can be required), and a PR opened after its last push is checked too. Nothing here
# reads the build: APK size and dependency vulnerabilities are checked by the Push-CI pipelines.

on:
  workflow_call:
    inputs:
      title-pattern:
        description: "Extended regex the PR title must match. Empty: '#123: type: description'"
        type: string
        default: ''
      contexts-dir:
        description: "Directory holding kanban.md, architecture.md and tests.md"
        type: string
        default: '.claude/contexts'
      code-paths:
        description: "Extended regex: changed files that count as code (kanban.md becomes mandatory)"
        type: string
        default: '^app/src/'
      test-paths:
        description: "Extended regex: changed files that count as tests (tests.md recommended)"
        type: string
        default: '^app/src/(test|androidTest)/'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pull-request:
    name: Pull Request Event
    runs-on: ubuntu-latest
    steps:
      - name: Require a pull_request event
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "ERROR: common-pr-ci.yml must be called from a workflow triggered by pull_request (got: $EVENT)"
            exit 1
          fi
          echo "Checking PR #${{ github.event.pull_request.number }}"

  pr-validation:
    needs: pull-request
    uses: ./.github/workflows/common-pr-title-validation.yml
    with:
      pr-title: ${{ github.event.pull_request.title }}
      title-pattern: ${{ inputs.title-pattern }}

  context-check:
    needs: pull-request
    uses: ./.github/workflows/common-context-check.yml
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
      contexts-dir: ${{ inputs.contexts-dir }}
      code-paths: ${{ inputs.code-paths }}
      test-paths: ${{ inputs.test-paths }}

  context-comment:
    needs: context-check
    if: always() && needs.context-check.result == 'failure'
    uses: ./.github/workflows/common-context-comment.yml
    permissions:
      pull-requests: write
    with:
      pr-number: ${{ github.event.pull_request.number }}
      missing: ${{ needs.context-check.outputs.missing }}
      warnings: ${{ needs.context-check.outputs.warnings }}
      contexts-dir: ${{ inputs.contexts-dir }}

  security-checks:
    needs: pull-request
    uses: ./.github/workflows/common-security-checks.yml
    permissions:
      contents: read
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
