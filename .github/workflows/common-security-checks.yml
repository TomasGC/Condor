name: Security Checks (Reusable)

# Secret scan of the PR's changes. Dependency vulnerabilities are scanned by Push-CI's lint stage (OSV-Scanner) and
# the APK size by kotlin-build-apk.yml, where the build is.

on:
  workflow_call:
    inputs:
      head-sha:
        description: "Commit to scan, the PR's head (default: the triggering commit)"
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head-sha != '' && inputs.head-sha || github.sha }}

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: origin/main
          head: HEAD
          extra_args: --only-verified
