name: Kotlin / Android Environment

# The end-to-end check of an Android app: the instrumented tests on an emulator, in two shards. `e2e`, named E2E
# (android), adds both shards' results into one summary and is the check that turns red or green.

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      python-version:
        type: string
        default: '3.12'
      test-task:
        description: "Gradle task that runs the instrumented tests, e.g. :app-instrumented:connectedDebugAndroidTest"
        type: string
        default: 'connectedDebugAndroidTest'
      avd-name:
        description: "Android Virtual Device name to create and run tests on"
        type: string
        default: 'app_test_avd'
      pre-test-command:
        description: "Shell commands to run before tests (e.g. generate test archives)."
        type: string
        default: ''
      archives-local-dir:
        description: "Local directory with archives to push to device (e.g. archives/)."
        type: string
        default: ''
      device-archives-path:
        description: "Device path where archives should be pushed (e.g. /sdcard/otter)."
        type: string
        default: ''
      manage-external-storage-package:
        description: "If set, grants the MANAGE_EXTERNAL_STORAGE app-op to this package before running tests. Needed when tests read files pushed to shared storage (e.g. /sdcard), which land media_rw-owned and are otherwise unreadable by the app under scoped storage."
        type: string
        default: ''
      fixtures-device-path:
        description: "Device folder the fixtures are pushed to, e.g. /data/local/tmp/osprey-fixtures. Empty: they are not pushed."
        type: string
        default: ''
      retention-days:
        type: number
        default: 7
      fixtures-repo:
        description: "Private repository of test files, e.g. TomasGC/Osprey-fixtures. Empty: no fixtures, no step."
        type: string
        default: ''
      require-fixtures:
        description: "Set REQUIRE_FIXTURES=1, so a test that needs the fixtures fails instead of being skipped."
        type: boolean
        default: false
      fixtures-environment:
        description: "GitHub Environment of the caller that holds the secret FIXTURES_DEPLOY_KEY and limits the branches that may read it."
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  instrumented:
    name: Android shard ${{ matrix.shard-index }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.fixtures-environment != '' && inputs.fixtures-environment || null }}
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1]
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android system image
        uses: actions/cache@v4
        id: system-image-cache
        with:
          path: /usr/local/lib/android/sdk/system-images/android-30/
          key: android-system-image-api30-default-x86_64-v1

      - name: Install system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: ./gradlew pixel4api30Setup

      - name: Cache Android emulator
        uses: actions/cache@v4
        id: emulator-cache
        with:
          path: /usr/local/lib/android/sdk/emulator/
          key: android-emulator-v1

      - name: Install emulator
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "emulator"

      - name: Create AVD and start emulator
        timeout-minutes: 20
        run: |
          mkdir -p /home/runner/.android/avd
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n "${{ inputs.avd-name }}" \
            -k "system-images;android-30;default;x86_64" \
            --device "pixel_4" \
            --force
          AVD_DIR="/home/runner/.android/avd/${{ inputs.avd-name }}.avd"
          sed -i '/^disk.dataPartition.size/d' "$AVD_DIR/config.ini"
          echo "disk.dataPartition.size=8G" >> "$AVD_DIR/config.ini"
          rm -f "$AVD_DIR/userdata-qemu.img" "$AVD_DIR/userdata.img"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

          $ANDROID_HOME/emulator/emulator \
            -avd "${{ inputs.avd-name }}" \
            -no-snapshot-load \
            -no-snapshot-save \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-window \
            -partition-size 8192 \
            -sdcard 2048M &

          echo "Waiting for emulator boot..."
          timeout 600 adb wait-for-device
          adb shell 'until [[ "$(getprop sys.boot_completed)" == "1" ]]; do sleep 2; done'
          sleep 5
          echo "Emulator ready"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Generate test archives
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}

      - name: Push archives to device
        if: inputs.archives-local-dir != '' && inputs.device-archives-path != ''
        run: |
          adb shell mkdir -p ${{ inputs.device-archives-path }}
          for f in ${{ inputs.archives-local-dir }}*; do
            [ -f "$f" ] && adb push "$f" ${{ inputs.device-archives-path }}/
          done

      - name: Fetch the private fixtures
        if: inputs.fixtures-repo != ''
        uses: TomasGC/condor/.github/actions/fetch-fixtures@feature/25-private-fixtures
        with:
          repository: ${{ inputs.fixtures-repo }}
          deploy-key: ${{ secrets.FIXTURES_DEPLOY_KEY }}
          require: ${{ inputs.require-fixtures }}
      - name: Push the fixtures to the device
        if: inputs.fixtures-repo != '' && inputs.fixtures-device-path != ''
        run: |
          adb shell mkdir -p "${{ inputs.fixtures-device-path }}"
          adb push "$FIXTURES_DIR/." "${{ inputs.fixtures-device-path }}/"
          adb shell chmod -R a+rX "${{ inputs.fixtures-device-path }}"

      - name: Grant MANAGE_EXTERNAL_STORAGE
        if: inputs.manage-external-storage-package != ''
        run: |
          ./gradlew installDebug installDebugAndroidTest
          adb shell appops set ${{ inputs.manage-external-storage-package }} MANAGE_EXTERNAL_STORAGE allow
          adb shell appops get ${{ inputs.manage-external-storage-package }} MANAGE_EXTERNAL_STORAGE

      - name: Run instrumented tests (shard ${{ matrix.shard-index }})
        run: |
          ./gradlew ${{ inputs.test-task }} \
            -Pandroid.testInstrumentationRunnerArguments.numShards=2 \
            "-Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard-index }}"             ${{ inputs.require-fixtures && '-Pandroid.testInstrumentationRunnerArguments.requireFixtures=1' || '' }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-shard-${{ matrix.shard-index }}
          path: '**/build/reports/androidTests/connected/'
          retention-days: ${{ inputs.retention-days }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-coverage-shard-${{ matrix.shard-index }}
          path: '**/build/outputs/code_coverage/'
          retention-days: ${{ inputs.retention-days }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-xml-shard-${{ matrix.shard-index }}
          path: '**/build/outputs/androidTest-results/'
          retention-days: ${{ inputs.retention-days }}

  e2e:
    name: E2E (android)
    needs: instrumented
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-android-xml-shard-*
          path: results
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Summary
        env:
          ENVIRONMENT: android
          RESULTS_GLOB: 'results/**/*.xml'
        run: |
          python - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = glob.glob(os.environ["RESULTS_GLOB"], recursive=True)
          tests = failed = skipped = 0
          seconds = 0.0
          for path in files:
              root = ET.parse(path).getroot()
              for suite in (root if root.tag == "testsuites" else [root]):
                  tests += int(suite.get("tests", 0))
                  failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))
                  seconds += float(suite.get("time", 0))
          passed = tests - failed - skipped
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### E2E ({os.environ['ENVIRONMENT']})\n\n| Passed | Failed | Skipped | Test time |\n|---|---|---|---|\n")
              out.write(f"| {passed} | {failed} | {skipped} | {seconds:.0f} s |\n")
          print(f"E2E ({os.environ['ENVIRONMENT']}): {passed} passed, {failed} failed, {skipped} skipped, {seconds:.0f} s")
          if tests == 0:
              print("::error::No end-to-end test results were found")
              sys.exit(1)
          PY
      - if: needs.instrumented.result != 'success'
        run: |
          echo "::error::An android shard failed"
          exit 1
