name: Kotlin / Push CI

# The one Kotlin pipeline for every project. Projects differ only by inputs: the Gradle commands of each test tier
# and the environments the app runs in. Validation and lint run beside the unit tier; each later tier waits for the
# one before it. A failed tier stops the tiers after it; an empty tier is skipped and does not stop them. Each
# environment then gets one end-to-end check, E2E (<environment>), in parallel with the others.

on:
  workflow_call:
    inputs:
      skip-on-no-changes:
        description: "Skip pipeline if no Kotlin/Gradle files changed. Set false to always run."
        type: boolean
        default: false
      java-version:
        type: string
        default: '21'
      python-version:
        type: string
        default: '3.12'
      pre-test-command:
        description: "Shell commands to run before each JVM test job (e.g. archive generation). Supports && chaining."
        type: string
        default: ''
      unit-tasks:
        description: 'JSON array of Gradle commands for the unit tier, e.g. [":core:test", ":app:testDebugUnitTest"]. Empty list skips the tier.'
        type: string
        default: '[]'
      integration-mock-tasks:
        description: 'JSON array of Gradle commands for the integration-mock tier. Empty list skips the tier.'
        type: string
        default: '[]'
      integration-real-tasks:
        description: 'JSON array of Gradle commands for the integration-real tier. Empty list skips the tier.'
        type: string
        default: '[]'
      app-environments:
        description: 'JSON list of the environments the app runs in, e.g. ["android", "windows", "linux"]. Known: android, windows, linux. Each one gets an end-to-end check named E2E (<environment>); an unknown name fails the run at the start. An empty list skips the end-to-end checks and the APK build.'
        type: string
        default: '[]'
      android-e2e-task:
        description: 'Gradle task of the android end-to-end tests.'
        type: string
        default: ':app-instrumented:connectedDebugAndroidTest'
      desktop-e2e-task:
        description: 'Gradle task of the desktop end-to-end tests, run once per desktop environment.'
        type: string
        default: ':desktop:e2e'
      avd-name:
        type: string
        default: 'app_test_avd'
      archives-local-dir:
        description: "Local directory with archives to push to device after emulator boots."
        type: string
        default: ''
      device-archives-path:
        description: "Device path where archives are pushed."
        type: string
        default: ''
      manage-external-storage-package:
        description: "If set, grants MANAGE_EXTERNAL_STORAGE to this package before instrumented tests run."
        type: string
        default: ''
      coverage-threshold:
        type: number
        default: 80
      apk-size-limit-mb:
        type: number
        default: 50
      app-name:
        description: "App name used for coverage badge gist filename"
        type: string
        default: 'app'
      android-fixtures-device-path:
        description: "Device folder the fixtures are pushed to before the android end-to-end tests."
        type: string
        default: ''
      retention-days:
        type: number
        default: 7
      fixtures-repo:
        description: "Private repository of test files, e.g. TomasGC/Osprey-fixtures. Empty: no fixtures, no step."
        type: string
        default: ''
      require-fixtures:
        description: "Set REQUIRE_FIXTURES=1, so a test that needs the fixtures fails instead of being skipped."
        type: boolean
        default: false
      install-ffmpeg:
        description: "Install ffmpeg before the tests, for tests that decode HEIC photos or video frames with it."
        type: boolean
        default: false
      fixtures-environment:
        description: "GitHub Environment of the caller that holds the secret FIXTURES_DEPLOY_KEY and limits the branches that may read it."
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # First of all: an unknown environment name stops the run before anything is built.
  validate-environments:
    name: Validate app environments
    runs-on: ubuntu-latest
    steps:
      - name: Check the environment names
        env:
          ENVIRONMENTS: ${{ inputs.app-environments }}
        run: |
          unknown=$(jq -cn --argjson wanted "$ENVIRONMENTS" --argjson known '["android","windows","linux"]' '$wanted - $known')
          if [ "$unknown" != "[]" ]; then
            echo "::error::Unknown app environment(s) $unknown. Known: android, windows, linux."
            exit 1
          fi

  # Lightweight, drives skip-on-no-changes gating below
  detect-changes:
    needs: validate-environments
    uses: ./.github/workflows/kotlin-detect-changes.yml

  validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true')
    uses: ./.github/workflows/kotlin-validation.yml

  lint-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true')
    uses: ./.github/workflows/kotlin-lint-checks.yml
    secrets: inherit
    with:
      java-version: ${{ inputs.java-version }}

  # Runs beside validation and lint: a failing check does not stop the tests.
  unit-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true')
    uses: ./.github/workflows/kotlin-gradle-tier.yml
    secrets: inherit
    with:
      install-ffmpeg: ${{ inputs.install-ffmpeg }}
      fixtures-repo: ${{ inputs.fixtures-repo }}
      require-fixtures: ${{ inputs.require-fixtures }}
      fixtures-environment: ${{ inputs.fixtures-environment }}
      tasks: ${{ inputs.unit-tasks }}
      java-version: ${{ inputs.java-version }}
      pre-test-command: ${{ inputs.pre-test-command }}
      retention-days: ${{ inputs.retention-days }}

  # Tier chain: a failed tier stops the next ones; a skipped (empty) tier does not.
  integration-mock:
    needs: [detect-changes, unit-tests]
    if: ${{ !failure() && !cancelled() && needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true') }}
    uses: ./.github/workflows/kotlin-gradle-tier.yml
    secrets: inherit
    with:
      install-ffmpeg: ${{ inputs.install-ffmpeg }}
      fixtures-repo: ${{ inputs.fixtures-repo }}
      require-fixtures: ${{ inputs.require-fixtures }}
      fixtures-environment: ${{ inputs.fixtures-environment }}
      tasks: ${{ inputs.integration-mock-tasks }}
      java-version: ${{ inputs.java-version }}
      pre-test-command: ${{ inputs.pre-test-command }}
      retention-days: ${{ inputs.retention-days }}

  integration-real:
    needs: [detect-changes, integration-mock]
    if: ${{ !failure() && !cancelled() && needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true') }}
    uses: ./.github/workflows/kotlin-gradle-tier.yml
    secrets: inherit
    with:
      install-ffmpeg: ${{ inputs.install-ffmpeg }}
      fixtures-repo: ${{ inputs.fixtures-repo }}
      require-fixtures: ${{ inputs.require-fixtures }}
      fixtures-environment: ${{ inputs.fixtures-environment }}
      tasks: ${{ inputs.integration-real-tasks }}
      java-version: ${{ inputs.java-version }}
      pre-test-command: ${{ inputs.pre-test-command }}
      retention-days: ${{ inputs.retention-days }}

  build-apk:
    needs: [detect-changes, integration-real]
    if: ${{ !failure() && !cancelled() && needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true') && contains(fromJSON(inputs.app-environments), 'android') }}
    uses: ./.github/workflows/kotlin-build-apk.yml
    with:
      java-version: ${{ inputs.java-version }}
      apk-size-limit-mb: ${{ inputs.apk-size-limit-mb }}
      retention-days: ${{ inputs.retention-days }}

  coverage:
    needs: [detect-changes, integration-real]
    if: ${{ !failure() && !cancelled() && needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true') }}
    uses: ./.github/workflows/kotlin-coverage.yml
    secrets: inherit
    with:
      install-ffmpeg: ${{ inputs.install-ffmpeg }}
      fixtures-repo: ${{ inputs.fixtures-repo }}
      require-fixtures: ${{ inputs.require-fixtures }}
      fixtures-environment: ${{ inputs.fixtures-environment }}
      java-version: ${{ inputs.java-version }}
      python-version: ${{ inputs.python-version }}
      pre-test-command: ${{ inputs.pre-test-command }}
      coverage-threshold: ${{ inputs.coverage-threshold }}
      app-name: ${{ inputs.app-name }}
      retention-days: ${{ inputs.retention-days }}
      unit-tasks: ${{ inputs.unit-tasks }}
      integration-mock-tasks: ${{ inputs.integration-mock-tasks }}
      integration-real-tasks: ${{ inputs.integration-real-tasks }}

  # One stanza per known environment: `uses:` cannot take an expression, so a new environment is one file and one
  # stanza here, and no project changes. The environments run in parallel after the integration-real tier.
  e2e-android:
    needs: [detect-changes, build-apk]
    if: ${{ !failure() && !cancelled() && needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true') && contains(fromJSON(inputs.app-environments), 'android') }}
    uses: ./.github/workflows/kotlin-env-android.yml
    secrets: inherit
    with:
      fixtures-device-path: ${{ inputs.android-fixtures-device-path }}
      install-ffmpeg: ${{ inputs.install-ffmpeg }}
      fixtures-repo: ${{ inputs.fixtures-repo }}
      require-fixtures: ${{ inputs.require-fixtures }}
      fixtures-environment: ${{ inputs.fixtures-environment }}
      java-version: ${{ inputs.java-version }}
      python-version: ${{ inputs.python-version }}
      avd-name: ${{ inputs.avd-name }}
      pre-test-command: ${{ inputs.pre-test-command }}
      archives-local-dir: ${{ inputs.archives-local-dir }}
      device-archives-path: ${{ inputs.device-archives-path }}
      manage-external-storage-package: ${{ inputs.manage-external-storage-package }}
      retention-days: ${{ inputs.retention-days }}
      test-task: ${{ inputs.android-e2e-task }}

  e2e-windows:
    needs: [detect-changes, integration-real]
    if: ${{ !failure() && !cancelled() && needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true') && contains(fromJSON(inputs.app-environments), 'windows') }}
    uses: ./.github/workflows/kotlin-env-desktop.yml
    secrets: inherit
    with:
      install-ffmpeg: ${{ inputs.install-ffmpeg }}
      fixtures-repo: ${{ inputs.fixtures-repo }}
      require-fixtures: ${{ inputs.require-fixtures }}
      fixtures-environment: ${{ inputs.fixtures-environment }}
      os: windows
      task: ${{ inputs.desktop-e2e-task }}
      java-version: ${{ inputs.java-version }}
      pre-test-command: ${{ inputs.pre-test-command }}
      retention-days: ${{ inputs.retention-days }}

  e2e-linux:
    needs: [detect-changes, integration-real]
    if: ${{ !failure() && !cancelled() && needs.detect-changes.outputs.docs-only != 'true' && (inputs.skip-on-no-changes == false || needs.detect-changes.outputs.kotlin == 'true') && contains(fromJSON(inputs.app-environments), 'linux') }}
    uses: ./.github/workflows/kotlin-env-desktop.yml
    secrets: inherit
    with:
      install-ffmpeg: ${{ inputs.install-ffmpeg }}
      fixtures-repo: ${{ inputs.fixtures-repo }}
      require-fixtures: ${{ inputs.require-fixtures }}
      fixtures-environment: ${{ inputs.fixtures-environment }}
      os: linux
      task: ${{ inputs.desktop-e2e-task }}
      java-version: ${{ inputs.java-version }}
      pre-test-command: ${{ inputs.pre-test-command }}
      retention-days: ${{ inputs.retention-days }}
