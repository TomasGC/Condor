name: Kotlin / Desktop Environment

# The end-to-end check of a desktop app on one operating system: one JVM job that runs the project's desktop task,
# named E2E (<os>), with its own summary. Windows and Linux are the same file with a different runner.

on:
  workflow_call:
    inputs:
      os:
        description: "Operating system to run on: windows or linux."
        type: string
        required: true
      task:
        description: "Gradle task of the desktop end-to-end tests."
        type: string
        default: ':desktop:e2e'
      java-version:
        type: string
        default: '21'
      pre-test-command:
        description: "Shell commands to run before the tests (e.g. archive generation). Supports && chaining."
        type: string
        default: ''
      retention-days:
        type: number
        default: 7
      fixtures-repo:
        description: "Private repository of test files, e.g. TomasGC/Osprey-fixtures. Empty: no fixtures, no step."
        type: string
        default: ''
      require-fixtures:
        description: "Set REQUIRE_FIXTURES=1, so a test that needs the fixtures fails instead of being skipped."
        type: boolean
        default: false
      fixtures-environment:
        description: "GitHub Environment of the caller that holds the secret FIXTURES_DEPLOY_KEY and limits the branches that may read it."
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: E2E (${{ inputs.os }})
    runs-on: ${{ inputs.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: ${{ inputs.fixtures-environment != '' && inputs.fixtures-environment || null }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pre-test setup
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}
      - name: Fetch the private fixtures
        if: inputs.fixtures-repo != ''
        uses: TomasGC/condor/.github/actions/fetch-fixtures@feature/25-private-fixtures
        with:
          repository: ${{ inputs.fixtures-repo }}
          deploy-key: ${{ secrets.FIXTURES_DEPLOY_KEY }}
          require: ${{ inputs.require-fixtures }}
      - run: ./gradlew ${{ inputs.task }}
      - name: Summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.os }}
          RESULTS_GLOB: '**/build/test-results/**/*.xml'
        run: |
          python - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = glob.glob(os.environ["RESULTS_GLOB"], recursive=True)
          tests = failed = skipped = 0
          seconds = 0.0
          for path in files:
              root = ET.parse(path).getroot()
              for suite in (root if root.tag == "testsuites" else [root]):
                  tests += int(suite.get("tests", 0))
                  failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))
                  seconds += float(suite.get("time", 0))
          passed = tests - failed - skipped
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### E2E ({os.environ['ENVIRONMENT']})\n\n| Passed | Failed | Skipped | Test time |\n|---|---|---|---|\n")
              out.write(f"| {passed} | {failed} | {skipped} | {seconds:.0f} s |\n")
          print(f"E2E ({os.environ['ENVIRONMENT']}): {passed} passed, {failed} failed, {skipped} skipped, {seconds:.0f} s")
          if tests == 0:
              print("::error::No end-to-end test results were found")
              sys.exit(1)
          PY
      - name: Artifact name
        if: always()
        id: name
        run: echo "slug=e2e-${{ inputs.os }}-test-results" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.slug }}
          path: '**/build/test-results/'
          retention-days: ${{ inputs.retention-days }}
