name: Condor / Test PR Pipeline

# Condor runs its PR pipeline on its own pull requests, exactly as a calling project does (README caller template):
# its context files in .claude/contexts/, workflows as the code, and the default title convention
# ("#N: type: description").

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: condor-test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-pipeline:
    name: PR pipeline on this PR
    uses: ./.github/workflows/common-pr-ci.yml
    with:
      contexts-dir: .claude/contexts
      code-paths: '^\.github/'
      test-paths: '^tests/'
