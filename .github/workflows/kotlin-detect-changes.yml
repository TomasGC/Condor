name: Kotlin / Detect Changes

on:
  workflow_call:
    outputs:
      kotlin:
        description: "Whether Kotlin/Gradle files changed"
        value: ${{ jobs.detect.outputs.kotlin }}
      docs-only:
        description: "Whether only markdown files changed in the push"
        value: ${{ jobs.detect.outputs.docs-only }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      kotlin: ${{ steps.filter.outputs.kotlin }}
      docs-only: ${{ steps.docs-check.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: TomasGC/Condor/.github/actions/check-docs-only@main
        id: docs-check
        with:
          before: ${{ github.event.before }}
          after: ${{ github.event.after }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            kotlin:
              - 'app/src/**'
              - 'app/build.gradle.kts'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
