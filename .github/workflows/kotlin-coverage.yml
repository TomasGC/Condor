name: Kotlin / Coverage

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      python-version:
        type: string
        default: '3.12'
      pre-test-command:
        description: "Shell commands needed to generate test data before Kover runs (e.g. archive generation). Supports && chaining."
        type: string
        default: ''
      unit-tasks:
        description: 'JSON array of Gradle commands for the unit tier. Run here too, so the merged report includes every module.'
        type: string
        default: '[]'
      integration-mock-tasks:
        description: 'JSON array of Gradle commands for the integration-mock tier.'
        type: string
        default: '[]'
      integration-real-tasks:
        description: 'JSON array of Gradle commands for the integration-real tier.'
        type: string
        default: '[]'
      coverage-threshold:
        type: number
        default: 80
      app-name:
        description: "App name used for coverage badge gist filename (e.g. 'otter')"
        type: string
        default: 'app'
      retention-days:
        type: number
        default: 7
      fixtures-repo:
        description: "Private repository of test files, e.g. TomasGC/Osprey-fixtures. Empty: no fixtures, no step."
        type: string
        default: ''
      require-fixtures:
        description: "Set REQUIRE_FIXTURES=1, so a test that needs the fixtures fails instead of being skipped."
        type: boolean
        default: false
      install-ffmpeg:
        description: "Install ffmpeg before the tests, for tests that decode HEIC photos or video frames with it."
        type: boolean
        default: false
      fixtures-environment:
        description: "GitHub Environment of the caller that holds the secret FIXTURES_DEPLOY_KEY and limits the branches that may read it."
        type: string
        default: ''
      coverage-report-tasks:
        description: 'JSON array of Gradle tasks that write the coverage report, run in order, all required. Leave the HTML task out to skip the HTML report.'
        type: string
        default: '["koverXmlReportDebug", "koverHtmlReportDebug"]'
      coverage-xml-path:
        description: "XML report the threshold is read from. Kover names it report<Variant>.xml after the variant."
        type: string
        default: 'app/build/reports/kover/reportDebug.xml'
      coverage-artifact-path:
        description: "Folder uploaded as the coverage-report artifact."
        type: string
        default: 'app/build/reports/kover/'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ inputs.fixtures-environment != '' && inputs.fixtures-environment || null }}
    steps:
      - name: Validate the coverage inputs
        uses: TomasGC/Condor/.github/actions/validate-inputs@main
        with:
          module: kotlin-coverage
          values: ${{ toJSON(inputs) }}
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: TomasGC/Condor/.github/actions/warm-gradle-wrapper@main

      - name: Install ffmpeg
        if: inputs.install-ffmpeg
        uses: TomasGC/Condor/.github/actions/install-ffmpeg@main
      - name: Fetch the private fixtures
        if: inputs.fixtures-repo != ''
        uses: TomasGC/Condor/.github/actions/fetch-fixtures@main
        with:
          repository: ${{ inputs.fixtures-repo }}
          deploy-key: ${{ secrets.FIXTURES_DEPLOY_KEY }}
          require: ${{ inputs.require-fixtures }}

      # Re-runs the JVM test tiers here, in one Gradle invocation, instead of downloading each tier
      # job's binary report: a cross-module .ic file (e.g. :core's) needs to land back at its own
      # module path (core/build/kover/bin-reports/...) for Kover's cross-module merge to see it,
      # and relying on actions/upload-artifact to preserve that path was not worth the risk.
      - name: Run JVM test tiers
        env:
          UNIT_TASKS: ${{ inputs.unit-tasks }}
          MOCK_TASKS: ${{ inputs.integration-mock-tasks }}
          REAL_TASKS: ${{ inputs.integration-real-tasks }}
        run: |
          TASKS="$(jq -rn --argjson a "$UNIT_TASKS" --argjson b "$MOCK_TASKS" --argjson c "$REAL_TASKS" '($a + $b + $c) | join(" ")')"
          if [ -z "$TASKS" ]; then
            echo "No JVM tasks configured for this project; nothing to cover"
          else
            ./gradlew $TASKS
          fi

      - uses: actions/setup-python@v5
        if: inputs.pre-test-command != ''
        with:
          python-version: ${{ inputs.python-version }}
      - name: Pre-coverage setup
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}

      - name: Generate the coverage report
        uses: TomasGC/Condor/.github/actions/run-gradle-tasks@main
        with:
          tasks: ${{ inputs.coverage-report-tasks }}

      - name: Verify coverage threshold
        id: coverage
        uses: TomasGC/Condor/.github/actions/check-coverage@main
        with:
          report-path: ${{ inputs.coverage-xml-path }}
          threshold: ${{ inputs.coverage-threshold }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ inputs.coverage-artifact-path }}
          retention-days: ${{ inputs.retention-days }}

      - name: Create coverage badge
        if: always() && env.COVERAGE_GIST_ID != ''
        env:
          COVERAGE_GIST_ID: ${{ secrets.COVERAGE_GIST_ID }}
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        with:
          auth: ${{ secrets.GITHUB_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: ${{ inputs.app-name }}-coverage.json
          label: Coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          maxColorRange: 100
          minColorRange: 0
