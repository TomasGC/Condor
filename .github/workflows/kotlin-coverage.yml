name: Kotlin / Coverage

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      python-version:
        type: string
        default: '3.12'
      pre-test-command:
        description: "Shell commands needed to generate test data before Kover runs (e.g. archive generation). Supports && chaining."
        type: string
        default: ''
      unit-tasks:
        description: 'JSON array of Gradle commands for the unit tier. Run here too, so the merged report includes every module.'
        type: string
        default: '[]'
      integration-mock-tasks:
        description: 'JSON array of Gradle commands for the integration-mock tier.'
        type: string
        default: '[]'
      integration-real-tasks:
        description: 'JSON array of Gradle commands for the integration-real tier.'
        type: string
        default: '[]'
      coverage-threshold:
        type: number
        default: 80
      app-name:
        description: "App name used for coverage badge gist filename (e.g. 'otter')"
        type: string
        default: 'app'
      retention-days:
        type: number
        default: 7

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # Re-runs the JVM test tiers here, in one Gradle invocation, instead of downloading each tier
      # job's binary report: a cross-module .ic file (e.g. :core's) needs to land back at its own
      # module path (core/build/kover/bin-reports/...) for Kover's cross-module merge to see it,
      # and relying on actions/upload-artifact to preserve that path was not worth the risk.
      - name: Run JVM test tiers
        env:
          UNIT_TASKS: ${{ inputs.unit-tasks }}
          MOCK_TASKS: ${{ inputs.integration-mock-tasks }}
          REAL_TASKS: ${{ inputs.integration-real-tasks }}
        run: |
          TASKS="$(jq -rn --argjson a "$UNIT_TASKS" --argjson b "$MOCK_TASKS" --argjson c "$REAL_TASKS" '($a + $b + $c) | join(" ")')"
          if [ -z "$TASKS" ]; then
            echo "No JVM tasks configured for this project; nothing to cover"
          else
            ./gradlew $TASKS
          fi

      - uses: actions/setup-python@v5
        if: inputs.pre-test-command != ''
        with:
          python-version: ${{ inputs.python-version }}
      - name: Pre-coverage setup
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}

      - name: Generate merged Kover report
        run: |
          ./gradlew koverXmlReportDebug
          ./gradlew koverHtmlReportDebug

      - name: Verify coverage threshold
        id: coverage
        run: |
          XML_REPORT="app/build/reports/kover/reportDebug.xml"
          if [ ! -f "$XML_REPORT" ]; then
            echo "ERROR: Coverage report not found at $XML_REPORT"
            exit 1
          fi
          # The report element's own LINE counter (the project total) is the last one in the file:
          # JaCoCo/Kover XML nests package/class/method counters inside it, so the outer report's
          # rolled-up counter is written after all of them, not before.
          MISSED=$(grep '<counter type="LINE"' "$XML_REPORT" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p' | tail -1)
          COVERED=$(grep '<counter type="LINE"' "$XML_REPORT" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p' | tail -1)
          TOTAL=$((MISSED + COVERED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: No coverage data (0 lines)"
            exit 1
          fi
          PERCENT=$((COVERED * 100 / TOTAL))
          echo "Coverage: ${PERCENT}% ($COVERED/$TOTAL lines)"
          echo "percentage=$PERCENT" >> $GITHUB_OUTPUT
          THRESHOLD=${{ inputs.coverage-threshold }}
          if [ "$PERCENT" -lt "$THRESHOLD" ]; then
            echo "ERROR: Coverage ${PERCENT}% below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "SUCCESS: Coverage ${PERCENT}% >= ${THRESHOLD}%"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/kover/
          retention-days: ${{ inputs.retention-days }}

      - name: Create coverage badge
        if: always() && env.COVERAGE_GIST_ID != ''
        env:
          COVERAGE_GIST_ID: ${{ secrets.COVERAGE_GIST_ID }}
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        with:
          auth: ${{ secrets.GITHUB_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: ${{ inputs.app-name }}-coverage.json
          label: Coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          maxColorRange: 100
          minColorRange: 0
