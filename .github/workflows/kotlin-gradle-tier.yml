name: Kotlin / Gradle Tier

# One test tier of a Kotlin project: one matrix job per Gradle command, all in parallel. An empty command list
# skips the tier. Each project names its own commands, so the tiers follow its module layout, not Condor's.

on:
  workflow_call:
    inputs:
      tasks:
        description: 'JSON array of Gradle commands for this tier, e.g. [":core:test", ":app:testDebugUnitTest"]. Empty list skips the tier.'
        type: string
        default: '[]'
      java-version:
        type: string
        default: '21'
      pre-test-command:
        description: "Shell commands to run before the tests (e.g. archive generation). Supports && chaining."
        type: string
        default: ''
      retention-days:
        type: number
        default: 7
      fixtures-repo:
        description: "Private repository of test files, e.g. TomasGC/Osprey-fixtures. Empty: no fixtures, no step."
        type: string
        default: ''
      require-fixtures:
        description: "Set REQUIRE_FIXTURES=1, so a test that needs the fixtures fails instead of being skipped."
        type: boolean
        default: false
      fixtures-environment:
        description: "GitHub Environment of the caller that holds the secret FIXTURES_DEPLOY_KEY and limits the branches that may read it."
        type: string
        default: ''
    secrets:
      FIXTURES_DEPLOY_KEY:
        description: "Read-only deploy key of fixtures-repo, held by the caller's fixtures-environment."
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    name: Tests / ${{ matrix.task }}
    if: inputs.tasks != '[]'
    runs-on: ubuntu-latest
    environment: ${{ inputs.fixtures-environment != '' && inputs.fixtures-environment || null }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: actions/setup-python@v5
        if: inputs.pre-test-command != ''
        with:
          python-version: '3.12'
      - name: Pre-test setup
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}
      - name: Fetch the private fixtures
        if: inputs.fixtures-repo != ''
        uses: TomasGC/condor/.github/actions/fetch-fixtures@feature/25-private-fixtures
        with:
          repository: ${{ inputs.fixtures-repo }}
          deploy-key: ${{ secrets.FIXTURES_DEPLOY_KEY }}
          require: ${{ inputs.require-fixtures }}
      - run: ./gradlew ${{ matrix.task }}
      - name: Artifact name
        id: name
        env:
          TASK: ${{ matrix.task }}
        run: echo "slug=$(echo "$TASK" | tr -c 'A-Za-z0-9' '-' | sed 's/-*$//')" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.slug }}-test-results
          path: '**/build/test-results/'
          retention-days: ${{ inputs.retention-days }}
