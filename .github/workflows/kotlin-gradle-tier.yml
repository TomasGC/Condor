name: Kotlin / Gradle Tier

# One test tier of a Kotlin project: one matrix job per Gradle command, all in parallel. An empty command list
# skips the tier. Each project names its own commands, so the tiers follow its module layout, not Condor's.

on:
  workflow_call:
    inputs:
      tasks:
        description: 'JSON array of Gradle commands for this tier, e.g. [":core:test", ":app:testDebugUnitTest"]. Empty list skips the tier.'
        type: string
        default: '[]'
      java-version:
        type: string
        default: '21'
      pre-test-command:
        description: "Shell commands to run before the tests (e.g. archive generation). Supports && chaining."
        type: string
        default: ''
      retention-days:
        type: number
        default: 7

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    name: Tests / ${{ matrix.task }}
    if: inputs.tasks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: actions/setup-python@v5
        if: inputs.pre-test-command != ''
        with:
          python-version: '3.12'
      - name: Pre-test setup
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}
      - run: ./gradlew ${{ matrix.task }}
      - name: Artifact name
        id: name
        env:
          TASK: ${{ matrix.task }}
        run: echo "slug=$(echo "$TASK" | tr -c 'A-Za-z0-9' '-' | sed 's/-*$//')" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.slug }}-test-results
          path: '**/build/test-results/'
          retention-days: ${{ inputs.retention-days }}
