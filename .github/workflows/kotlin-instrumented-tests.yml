name: Kotlin / Instrumented Tests

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      python-version:
        type: string
        default: '3.12'
      avd-name:
        description: "Android Virtual Device name to create and run tests on"
        type: string
        default: 'app_test_avd'
      pre-test-command:
        description: "Shell commands to run before tests (e.g. generate test archives)."
        type: string
        default: ''
      archives-local-dir:
        description: "Local directory with archives to push to device (e.g. archives/)."
        type: string
        default: ''
      device-archives-path:
        description: "Device path where archives should be pushed (e.g. /sdcard/otter)."
        type: string
        default: ''
      manage-external-storage-package:
        description: "If set, grants the MANAGE_EXTERNAL_STORAGE app-op to this package before running tests. Needed when tests read files pushed to shared storage (e.g. /sdcard), which land media_rw-owned and are otherwise unreadable by the app under scoped storage."
        type: string
        default: ''
      retention-days:
        type: number
        default: 7

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Runs once per cache-miss: downloads system image, creates AVD, cold-boots,
  # saves a snapshot. Subsequent runs skip this job's heavy work via cache hits.
  avd-setup:
    name: AVD Setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android system image
        uses: actions/cache@v4
        id: system-image-cache
        with:
          path: /usr/local/lib/android/sdk/system-images/android-30/
          key: android-system-image-api30-default-x86_64-v1

      - name: Install system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: ./gradlew pixel4api30Setup

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-snapshot-cache
        with:
          path: |
            /home/runner/.android/avd/${{ inputs.avd-name }}.avd
            /home/runner/.android/avd/${{ inputs.avd-name }}.ini
          key: avd-snapshot-api30-default-x86_64-${{ inputs.avd-name }}-v1

      - name: Create AVD, boot and snapshot
        if: steps.avd-snapshot-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          mkdir -p /home/runner/.android/avd
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n "${{ inputs.avd-name }}" \
            -k "system-images;android-30;default;x86_64" \
            --device "pixel_4" \
            --force
          AVD_DIR="/home/runner/.android/avd/${{ inputs.avd-name }}.avd"
          sed -i '/^disk.dataPartition.size/d' "$AVD_DIR/config.ini"
          echo "disk.dataPartition.size=8G" >> "$AVD_DIR/config.ini"
          rm -f "$AVD_DIR/userdata-qemu.img" "$AVD_DIR/userdata.img"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          $ANDROID_HOME/emulator/emulator \
            -avd "${{ inputs.avd-name }}" \
            -no-snapshot-load \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-window \
            -partition-size 8192 \
            -sdcard 2048M &
          EMULATOR_PID=$!
          timeout 600 adb wait-for-device
          adb shell 'until [[ "$(getprop sys.boot_completed)" == "1" ]]; do sleep 2; done'
          sleep 10
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "Saving AVD snapshot..."
          adb emu avd snapshot save ci_snapshot
          sleep 5
          kill $EMULATOR_PID || true
          wait $EMULATOR_PID 2>/dev/null || true
          echo "Snapshot saved"

  instrumented:
    name: Instrumented Tests (shard ${{ matrix.shard-index }})
    needs: avd-setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android system image
        uses: actions/cache@v4
        id: system-image-restore
        with:
          path: /usr/local/lib/android/sdk/system-images/android-30/
          key: android-system-image-api30-default-x86_64-v1

      - name: Install system image (fallback)
        if: steps.system-image-restore.outputs.cache-hit != 'true'
        run: ./gradlew pixel4api30Setup

      - name: Restore AVD snapshot
        uses: actions/cache@v4
        id: avd-restore
        with:
          path: |
            /home/runner/.android/avd/${{ inputs.avd-name }}.avd
            /home/runner/.android/avd/${{ inputs.avd-name }}.ini
          key: avd-snapshot-api30-default-x86_64-${{ inputs.avd-name }}-v1

      - name: Create AVD (fallback)
        if: steps.avd-restore.outputs.cache-hit != 'true'
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          mkdir -p /home/runner/.android/avd
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n "${{ inputs.avd-name }}" \
            -k "system-images;android-30;default;x86_64" \
            --device "pixel_4" \
            --force
          AVD_DIR="/home/runner/.android/avd/${{ inputs.avd-name }}.avd"
          sed -i '/^disk.dataPartition.size/d' "$AVD_DIR/config.ini"
          echo "disk.dataPartition.size=8G" >> "$AVD_DIR/config.ini"
          rm -f "$AVD_DIR/userdata-qemu.img" "$AVD_DIR/userdata.img"

      - name: Start emulator
        timeout-minutes: 10
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          if [[ "${{ steps.avd-restore.outputs.cache-hit }}" == "true" ]]; then
            SNAPSHOT_FLAG="-snapshot ci_snapshot"
            echo "Starting from snapshot"
          else
            SNAPSHOT_FLAG="-no-snapshot-load"
            echo "Starting cold boot (no snapshot)"
          fi
          $ANDROID_HOME/emulator/emulator \
            -avd "${{ inputs.avd-name }}" \
            $SNAPSHOT_FLAG \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-window \
            -partition-size 8192 \
            -sdcard 2048M &
          echo "Waiting for emulator boot..."
          timeout 300 adb wait-for-device
          adb shell 'until [[ "$(getprop sys.boot_completed)" == "1" ]]; do sleep 2; done'
          sleep 5
          echo "Emulator ready"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Generate test archives
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}

      - name: Push archives to device
        if: inputs.archives-local-dir != '' && inputs.device-archives-path != ''
        run: |
          adb shell mkdir -p ${{ inputs.device-archives-path }}
          for f in ${{ inputs.archives-local-dir }}*; do
            [ -f "$f" ] && adb push "$f" ${{ inputs.device-archives-path }}/
          done

      - name: Grant MANAGE_EXTERNAL_STORAGE
        if: inputs.manage-external-storage-package != ''
        run: |
          ./gradlew installDebug installDebugAndroidTest
          adb shell appops set ${{ inputs.manage-external-storage-package }} MANAGE_EXTERNAL_STORAGE allow
          adb shell appops get ${{ inputs.manage-external-storage-package }} MANAGE_EXTERNAL_STORAGE

      - name: Run instrumented tests (shard ${{ matrix.shard-index }})
        run: |
          ./gradlew connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.numShards=2 \
            "-Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard-index }}"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-shard-${{ matrix.shard-index }}
          path: app/build/reports/androidTests/connected/
          retention-days: ${{ inputs.retention-days }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-coverage-shard-${{ matrix.shard-index }}
          path: app/build/outputs/code_coverage/
          retention-days: ${{ inputs.retention-days }}
