name: Common / Context Check

on:
  workflow_call:
    inputs:
      head-sha:
        type: string
        required: true
      contexts-dir:
        description: "Directory holding kanban.md, architecture.md and tests.md"
        type: string
        default: '.claude/contexts'
      code-paths:
        description: "Extended regex: changed files that count as code (kanban.md becomes mandatory)"
        type: string
        default: '^app/src/'
      test-paths:
        description: "Extended regex: changed files that count as tests (tests.md recommended)"
        type: string
        default: '^app/src/(test|androidTest)/'
    outputs:
      needs_update:
        value: ${{ jobs.check.outputs.needs_update }}
      missing:
        value: ${{ jobs.check.outputs.missing }}
      warnings:
        value: ${{ jobs.check.outputs.warnings }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Verify Context Files Updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      missing: ${{ steps.check.outputs.missing }}
      warnings: ${{ steps.check.outputs.warnings }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head-sha }}

      - name: Check if contexts are updated
        id: check
        env:
          CONTEXTS_DIR: ${{ inputs.contexts-dir }}
          CODE_PATHS: ${{ inputs.code-paths }}
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          echo "Checking context files in $CONTEXTS_DIR/..."

          CHANGED=$(git diff --name-only origin/main...HEAD)
          CODE_CHANGES=$(echo "$CHANGED" | grep -E "$CODE_PATHS" || true)
          TEST_CHANGES=$(echo "$CHANGED" | grep -E "$TEST_PATHS" || true)
          KANBAN_UPDATED=$(echo "$CHANGED" | grep -Fx "$CONTEXTS_DIR/kanban.md" || true)
          ARCHITECTURE_UPDATED=$(echo "$CHANGED" | grep -Fx "$CONTEXTS_DIR/architecture.md" || true)
          TESTS_UPDATED=$(echo "$CHANGED" | grep -Fx "$CONTEXTS_DIR/tests.md" || true)

          MISSING_FILES=""
          WARNINGS=""

          # kanban.md: mandatory for any code changes
          if [ -n "$CODE_CHANGES" ] && [ -z "$KANBAN_UPDATED" ]; then
            echo "ERROR: $CONTEXTS_DIR/kanban.md not updated (MANDATORY)"
            MISSING_FILES="kanban.md"
          fi

          if [ -n "$CODE_CHANGES" ]; then
            # architecture.md: recommended for architectural changes
            ARCH_CHANGES=$(echo "$CODE_CHANGES" | xargs -d '\n' git diff origin/main...HEAD -- | grep -E '(class |interface |object |enum |data class |sealed |fun |@Inject|@Singleton|@HiltViewModel|Repository|UseCase|ViewModel)' || true)
            if [ -n "$ARCH_CHANGES" ] && [ -z "$ARCHITECTURE_UPDATED" ]; then
              echo "WARNING: $CONTEXTS_DIR/architecture.md not updated (architectural changes detected)"
              WARNINGS="architecture.md"
            fi

            # tests.md: recommended when test structure changes
            if [ -n "$TEST_CHANGES" ] && [ -z "$TESTS_UPDATED" ]; then
              echo "WARNING: $CONTEXTS_DIR/tests.md not updated (test files changed)"
              WARNINGS="${WARNINGS:+$WARNINGS,}tests.md"
            fi
          fi

          if [ -n "$MISSING_FILES" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "missing=$MISSING_FILES" >> $GITHUB_OUTPUT
            echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [ -n "$WARNINGS" ]; then
            echo "needs_update=warning" >> $GITHUB_OUTPUT
            echo "missing=" >> $GITHUB_OUTPUT
            echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "missing=" >> $GITHUB_OUTPUT
            echo "warnings=" >> $GITHUB_OUTPUT
            echo "SUCCESS: Context files updated"
          fi
